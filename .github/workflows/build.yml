# Builds the Minecraft 1.21.1 - 1.21.5 (Fabric) jar on every push to port-1.21.1 (or manually from the Actions tab).
# A release is only published from a manual run with "publish" ticked.
name: Build 1.21.1 (Fabric)

on:
  push:
    branches: [port-1.21.1]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the jar as a release (tag from hiveko_release)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Check jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev)
          ls -l build/libs
          unzip -p "$JAR" fabric.mod.json
          echo "entries: $(unzip -Z1 "$JAR" | wc -l)"
          unzip -Z1 "$JAR" | grep -c '^de/linusdev/data/\|^de/linusdev/lutils/' | sed 's/^/shaded library classes: /'
          unzip -p "$JAR" de/linusdev/OneWorldFolderModClient.class | strings | grep 'Application Support'

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: oneworldfolder-1.21.1-fabric
          path: build/libs/*.jar

      # Manual runs with "publish": publishes the jar as a release of this fork, tagged with
      # hiveko_release from gradle.properties, unless that release already exists.
      - name: Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep '^hiveko_release=' gradle.properties | cut -d= -f2)
          [ -n "$TAG" ] || exit 0
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev)
          gh release create "$TAG" $JAR --target "$GITHUB_SHA" --title "One World Folder $TAG" \
            --notes "Unofficial build of [One World Folder](https://modrinth.com/mod/oneworldfolder) 1.0.13 by LinusDev (Apache 2.0) for Minecraft 1.21.1 - 1.21.5 (Fabric), with the macOS support from 1.1.0 (lni-dev/oneworldfolder@5e9d866): the original saves folder is found in ~/Library/Application Support/minecraft. Requires Fabric API."
